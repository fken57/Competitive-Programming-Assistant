services:
  db:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cpa_dev}
      MARIADB_USER: ${MARIADB_USER:-cpa_dev}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in backend/.env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in backend/.env}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - cpa_mariadb_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cpa_mariadb_data:
