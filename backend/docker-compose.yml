services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpa_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cpa_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cpa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpa_dev} -d ${POSTGRES_DB:-cpa_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cpa_postgres_data:
