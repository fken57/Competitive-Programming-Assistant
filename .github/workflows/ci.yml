name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-architecture:
    name: Backend Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check backend dependency boundaries
        run: go test . -run '^TestArchitecture' -count=1 -timeout=2m

  backend-unit:
    name: Backend Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      MARIADB_TEST_DSN: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run backend tests with race detection
        run: go test -race -count=1 -timeout=5m . ./internal/...

  frontend-unit:
    name: Frontend Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-sample-app
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-sample-app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand

  e2e:
    name: E2E
    needs: [backend-architecture, backend-unit, frontend-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-sample-app
    env:
      CI: 'true'
      REACT_APP_API_BASE_URL: /apis
      DATABASE_URL: mariadb://cpa_e2e:cpa-e2e-only@127.0.0.1:13306/cpa_e2e
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: cpa_e2e
          MARIADB_USER: cpa_e2e
          MARIADB_PASSWORD: cpa-e2e-only
          MARIADB_ROOT_PASSWORD: cpa-e2e-root-only
        ports:
          - 13306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-sample-app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend for the Go server
        run: npm run build
      - name: Run browser E2E tests
        run: npm run test:e2e
      - name: Upload E2E report and server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            react-sample-app/playwright-report/
            react-sample-app/test-results/
            react-sample-app/e2e-server.log
          retention-days: 7
